    <!-- Prevent theme flash script: Default is Light Mode -->
    <script>
      try {
        const theme = localStorage.getItem('nexus_theme') || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
    <!-- Inter Font -->
